# Continuous integration for the Wisdom King mod.
# Builds the mod with the Gradle wrapper, then publishes the produced JAR and the
# full build log back into the repository (directory: release/) so that build
# results can be inspected without downloading workflow artifacts.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        id: gradle_build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Dump API signatures (temporary diagnostic)
        if: always()
        run: |
          mkdir -p release
          ( ./gradlew printClasspath --no-daemon --console=plain; echo "gradle-exit=$?" ) > release/classpath-gradle.log 2>&1 || true

          if [ -f release/classpath.txt ]; then
            # remapped minecraft jars first, then the rest (classpath order matters)
            CP=$( { grep 'minecraftMaven' release/classpath.txt; grep -v 'minecraftMaven' release/classpath.txt; } \
                  | grep '\.jar$' | grep -v -- '-sources\.jar$' | grep -v -- '-javadoc\.jar$' | tr '\n' ':' )
          else
            CP=$(find "$HOME/.gradle/caches" "$PWD/.gradle" -name '*.jar' 2>/dev/null | tr '\n' ':')
          fi
          echo "classpath entries: $(echo "$CP" | tr ':' '\n' | grep -c '\.jar')"

          # strip jar signatures so classes from different jars can share a package
          rm -rf /tmp/strip && mkdir -p /tmp/strip
          IDX=0
          for J in $(echo "$CP" | tr ':' '\n'); do
            [ -f "$J" ] || continue
            IDX=$((IDX+1))
            DST=$(printf "/tmp/strip/%03d-%s" "$IDX" "$(basename "$J")")
            cp -f "$J" "$DST"
            zip -q -d "$DST" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' >/dev/null 2>&1 || true
          done
          CP2=$(ls /tmp/strip/*.jar | tr '\n' ':')
          ( java -cp "$CP2" tools/ApiDump.java; echo "java-exit=$?" ) > release/api-dump.log 2>&1 || true
          if [ -f api-dump.txt ]; then cp -f api-dump.txt release/api-dump.txt; fi
          ls -la release

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p release
          cp build.log release/last-build-log.txt
          if ls build/libs/*.jar >/dev/null 2>&1; then
            cp build/libs/*.jar release/
            rm -f release/*-sources.jar
          fi
          ls -la release

      - name: Publish artifacts back to the branch
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "wisdomking-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f release
          if git diff --cached --quiet; then
            echo "No artifact changes to publish."
          else
            git commit -m "ci: build artifacts [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Fail job when the build failed
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "Gradle build failed - see release/last-build-log.txt"
          exit 1
