plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Soft-dependency compile-only repositories (optional integrations).
	maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }          // JEI
	maven { name = 'Jade'; url = 'https://maven2.ryanliptak.com/' }               // Jade / WTHIT
	maven { name = 'shedaniel'; url = 'https://maven.shedaniel.me/' }             // REI
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' } // EMI
	maven { name = 'MaxHenkel'; url = 'https://maven.maxhenkel.de/repository/public' } // Simple Voice Chat
	maven { name = 'CreateMod'; url = 'https://maven.createmod.net/' }            // Create
	maven { name = 'IronSpells'; url = 'https://maven.iron.wiki/' }               // Iron's Spells 'n Spellbooks
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wisdomking" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// TEMPORARY diagnostic task (removed before release): writes the resolved Minecraft/mod/library
// classpath to release/classpath.txt so that tools/ApiDump.java can be executed against the very
// same jars the compiler uses.
tasks.register('printClasspath') {
	group = 'verification'
	description = 'Writes the resolved compile/runtime classpath to release/classpath.txt.'
	def cfgs = configurations
	def srcSets = sourceSets
	doLast {
		def out = file('release/classpath.txt')
		out.parentFile.mkdirs()
		def lines = []
		try {
			lines.addAll(cfgs.minecraft.resolve().collect { it.absolutePath })
		} catch (Throwable t) {
			lines.add('# minecraft configuration failed: ' + t)
		}
		['main', 'client'].each { name ->
			def ss = srcSets.findByName(name)
			if (ss == null) {
				lines.add('# sourceSet missing: ' + name)
				return
			}
			try {
				lines.addAll(ss.compileClasspath.files.collect { it.absolutePath })
			} catch (Throwable t) {
				lines.add('# compileClasspath failed for ' + name + ': ' + t)
			}
			try {
				lines.addAll(ss.runtimeClasspath.files.collect { it.absolutePath })
			} catch (Throwable t) {
				lines.add('# runtimeClasspath failed for ' + name + ': ' + t)
			}
		}
		def unique = lines.unique()
		out.text = unique.join('\n') + '\n'
		println "wrote ${out} (${unique.size()} entries)"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
